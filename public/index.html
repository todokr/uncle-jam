<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<title>uncle-jam factory line</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    max-width: 720px;
    margin: 2rem auto;
    padding: 0 1rem;
    line-height: 1.5;
  }
  h1 { font-size: 1.25rem; }
  .states {
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
    margin: 1rem 0;
  }
  .state {
    border: 1px solid #8888;
    border-radius: 6px;
    padding: 0.4rem 0.75rem;
    font-size: 0.85rem;
    opacity: 0.5;
  }
  .state.active {
    opacity: 1;
    font-weight: bold;
    border-color: #4a90d9;
    background: #4a90d922;
  }
  .state.active.failed { border-color: #d94a4a; background: #d94a4a22; }
  .state.active.completed { border-color: #4ad97a; background: #4ad97a22; }
  fieldset { border: 1px solid #8885; border-radius: 6px; margin: 1rem 0; }
  label { display: block; margin: 0.5rem 0 0.2rem; font-size: 0.85rem; }
  input { padding: 0.3rem; width: 100%; box-sizing: border-box; }
  button {
    padding: 0.4rem 0.9rem;
    margin: 0.5rem 0.5rem 0 0;
    cursor: pointer;
  }
  button:disabled { cursor: not-allowed; opacity: 0.5; }
  pre {
    background: #8881;
    padding: 0.75rem;
    border-radius: 6px;
    overflow-x: auto;
    font-size: 0.8rem;
  }
  .error { color: #d94a4a; }
</style>
</head>
<body>
  <h1>uncle-jam — state machine + snapshot workflow</h1>
  <p>ワークフロー: <code>validate → waitForApproval → ship</code>（<code>waitForApproval</code>は外部承認が来るまでsuspendする）</p>

  <div class="states" id="states"></div>

  <fieldset>
    <legend>run</legend>
    <label for="orderId">order id</label>
    <input id="orderId" value="ORDER-1" />
    <button id="runBtn">run</button>
  </fieldset>

  <fieldset>
    <legend>suspended stepへの応答</legend>
    <button id="approveBtn">approve</button>
    <button id="rejectBtn">reject</button>
  </fieldset>

  <fieldset>
    <legend>snapshot</legend>
    <button id="resetBtn">reset</button>
  </fieldset>

  <p id="errorMsg" class="error"></p>
  <pre id="snapshot"></pre>

  <script>
    const STATES = ["pending", "running", "suspended", "completed", "failed"];
    const statesEl = document.getElementById("states");
    const snapshotEl = document.getElementById("snapshot");
    const errorEl = document.getElementById("errorMsg");
    const approveBtn = document.getElementById("approveBtn");
    const rejectBtn = document.getElementById("rejectBtn");

    function renderStates(current) {
      statesEl.innerHTML = "";
      for (const s of STATES) {
        const div = document.createElement("div");
        div.className = "state" + (s === current ? ` active ${s}` : "");
        div.textContent = s;
        statesEl.appendChild(div);
      }
    }

    function render(snapshot) {
      renderStates(snapshot.state);
      snapshotEl.textContent = JSON.stringify(snapshot, null, 2);
      const suspended = snapshot.state === "suspended";
      approveBtn.disabled = !suspended;
      rejectBtn.disabled = !suspended;
    }

    async function call(url, body) {
      errorEl.textContent = "";
      try {
        const res = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body ?? {}),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error ?? "request failed");
        render(data);
      } catch (err) {
        errorEl.textContent = err.message;
      }
    }

    async function refresh() {
      const res = await fetch("/api/state");
      render(await res.json());
    }

    document.getElementById("runBtn").addEventListener("click", () => {
      call("/api/run", { orderId: document.getElementById("orderId").value });
    });
    approveBtn.addEventListener("click", () => call("/api/resume", { approved: true }));
    rejectBtn.addEventListener("click", () => call("/api/resume", { approved: false }));
    document.getElementById("resetBtn").addEventListener("click", () => call("/api/reset"));

    refresh();
  </script>
</body>
</html>
